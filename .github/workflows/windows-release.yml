name: Gesture HMI - Windows standalone release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone EXE with same local builder
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging/Build_Windows_EXE.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build failed' }
      - name: Test installer and remove installation
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File release_out/Install_Gesture_HMI.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs/GestureHMI/GestureHMI.exe'
          & $exe --doctor
          if ($LASTEXITCODE -ne 0) { throw 'Installed EXE doctor failed' }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File release_out/Uninstall_Gesture_HMI.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
      - name: Upload Windows release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GestureHMI_Windows_x64
          path: |
            GestureHMI_Windows_x64.zip
            SHA256SUMS_release.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag GestureHMI_Windows_x64.zip SHA256SUMS_release.txt --clobber
          } else {
            gh release create $tag GestureHMI_Windows_x64.zip SHA256SUMS_release.txt --title "Gesture HMI $tag" --notes 'Windows x64 standalone package. No Python, Conda, or PyTorch required by end users.'
          }
